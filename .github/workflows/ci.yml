# Builds the solution and runs every test on each push and pull request.
# GitHub shows the result as a check mark (or a cross) next to each commit.
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # No database or secrets needed: services are tested with Moq, concurrency with SQLite in memory.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
